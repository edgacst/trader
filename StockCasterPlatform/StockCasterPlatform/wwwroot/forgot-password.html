<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀번호 찾기 | StockCaster</title>
  <link rel="stylesheet" href="/styles.css?v=20260815.2">
  <script defer src="/forgot-password.js"></script>
</head>
<body class="auth-page">
  <main class="auth-page-card">
    <a class="brand" href="/" aria-label="StockCaster 홈"><span class="brand-mark"><span class="chart-line"></span></span><span><strong>StockCaster</strong><small>LIVE MARKET</small></span></a>
    <div id="requestPanel">
      <div class="eyebrow">ACCOUNT RECOVERY</div>
      <h1>비밀번호 찾기</h1>
      <p>가입한 이메일을 입력하면 비밀번호 재설정 링크를 보내드립니다.</p>
      <form id="requestForm" class="auth-form">
        <label><span>이메일</span><input id="resetEmail" type="email" autocomplete="email" required placeholder="가입한 이메일"></label>
        <button class="primary-button" type="submit">재설정 메일 보내기</button>
      </form>
    </div>
    <div id="resetPanel" class="hidden">
      <div class="eyebrow">NEW PASSWORD</div>
      <h1>새 비밀번호 설정</h1>
      <p>새 비밀번호를 입력해 주세요.</p>
      <form id="resetForm" class="auth-form">
        <label><span>새 비밀번호</span><input id="newResetPassword" type="password" minlength="8" required autocomplete="new-password" placeholder="영문·숫자 포함 8자 이상"></label>
        <label><span>비밀번호 확인</span><input id="confirmResetPassword" type="password" minlength="8" required autocomplete="new-password"></label>
        <button class="primary-button" type="submit">비밀번호 변경</button>
      </form>
    </div>
    <div id="resetMessage" class="form-error hidden" role="status"></div>
    <a class="auth-back-link" href="/">홈으로 돌아가기</a>
  </main>
</body>
</html>
